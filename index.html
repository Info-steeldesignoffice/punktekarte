<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Punktekarte</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""/>

<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  .popup {
    min-width: 210px;
  }

  .popup h3 {
    margin: 0 0 10px 0;
    font-size: 17px;
  }

  .popup a {
    display: inline-block;
    padding: 9px 13px;
    background: #1677ff;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-size: 15px;
  }

  .popup a:active {
    background: #0b5dcc;
  }

  .details {
    margin: 8px 0 12px 0;
    line-height: 1.55;
    font-size: 14px;
  }

  .details div {
    margin: 2px 0;
  }

  .location-panel {
    position: absolute; z-index: 1100; top: 112px; left: 12px;
  }
  .location-button {
    padding: 10px 14px; background: white; color: #1677ff; border: 0;
    border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.18);
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .rating {
    margin: 6px 0 2px; font-size: 22px; letter-spacing: 2px; white-space: nowrap;
  }
  .rating button {
    background: none; border: 0; padding: 0 1px; font-size: 22px;
    cursor: pointer; line-height: 1;
  }
  .rating button:focus { outline: none; }
  .import-panel {
    position: absolute; z-index: 1100; top: 58px; left: 12px; right: 12px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .import-button {
    display: inline-block; padding: 10px 14px; background: white; color: #1677ff;
    border: 0; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.18);
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .import-status {
    background: rgba(255,255,255,.94); padding: 9px 11px; border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.14); font-size: 13px;
  }
  #csvFile { display: none; }

  .info {
    position: absolute;
    z-index: 1000;
    top: 12px;
    left: 12px;
    right: 12px;
    background: rgba(255,255,255,.94);
    padding: 10px 14px;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
    font-size: 14px;
  }
</style>
</head>

<body>

<div class="info">📍 Meine Punktekarte</div>
<div class="location-panel">
    <button id="locateButton" class="location-button" type="button">📍 Mein Standort</button>
  </div>
  <div class="import-panel">
  <label class="import-button" for="csvFile">📂 CSV aus Dateien auswählen</label>
<button id="exportCsvButton" class="import-button" type="button">💾 Bewertungen als CSV speichern</button>
  <input id="csvFile" type="file">
  <div id="importStatus" class="import-status">3 Testpunkte geladen</div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""></script>

<script>
let points = [
  {
    name: "Matera1",
    lat: 40.6800,
    lon: 16.6249,
    link: "https://park4night.com/de/place/63928",
    strom: "Ja",
    wasser: "Ja",
    entsorgung: "Nein",
    kosten: "10 € / Nacht",
    notiz: "Ruhiger Platz, Testeintrag"
  },
  {
    name: "Ostuni P",
    lat: 40.7325,
    lon: 17.5815,
    link: "https://park4night.com/de/place/13868",
    strom: "Unbekannt",
    wasser: "Ja",
    entsorgung: "Nein",
    kosten: "kostenlos",
    notiz: "Testeintrag"
  },
  {
    name: "Ostuni Masseria",
    lat: 40.7722,
    lon: 17.5839,
    link: "https://park4night.com/de/place/418373",
    strom: "Nein",
    wasser: "Ja",
    entsorgung: "Ja",
    kosten: "15 €",
    notiz: "Testeintrag"
  }
];

const map = L.map("map");
let markers = [];

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap-Mitwirkende'
}).addTo(map);

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
  return lines.map(line => {
    const result = []; let current = ""; let quoted = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (quoted && line[i + 1] === '"') { current += '"'; i++; }
        else { quoted = !quoted; }
      } else if (char === ";" && !quoted) { result.push(current); current = ""; }
      else { current += char; }
    }
    result.push(current); return result;
  });
}


function parseCoordinate(value) {
  const text = String(value ?? "").trim().replace(",", ".");
  if (!text) return NaN;
  const n = Number(text);
  return Number.isFinite(n) ? n : NaN;
}

function pointsFromCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(c => c.trim() !== "")).map(row => {
    const item = {};
    headers.forEach((h, i) => item[h] = (row[i] || "").trim());
    return {
      name: item.Name || "",
      adresse: item.Adresse || "",
      address: item.Adresse || item.Address || "",
      lat: Number(String(item.Latitude || "").replace(",", ".")),
      lon: Number(String(item.Longitude || "").replace(",", ".")),
      link: item.Park4Night || item["Parkplatz / Link"] || item["Parkplatz/Link"] || "",
      strom: item.Strom || "Unbekannt",
      wasser: item.Wasser || "Unbekannt",
      entsorgung: item.Entsorgung || "Unbekannt",
      wcDusche: (() => {
        const key = Object.keys(item).find(k =>
          k.normalize("NFKD").replace(/[^a-zA-Z0-9]/g, "").toLowerCase() === "wcdusche"
        );
        const value = key ? String(item[key]).trim() : "";
        return value || "Unbekannt";
      })(),
      kosten: item.Kosten || "",
      notiz: item.Notiz || "",
      bewertung: (() => {
        const n = Number(String(item.Bewertung || "").trim());
        return Number.isInteger(n) && n >= 1 && n <= 5 ? n : 0;
      })()
    };
  }).filter(p => p.name);
}


function distanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = value => value * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
    Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDistance(km) {
  if (km < 1) return `${Math.round(km * 1000)} m`;
  if (km < 100) return `${km.toFixed(1).replace(".", ",")} km`;
  return `${Math.round(km)} km`;
}


const ratingsKey = "punktekarte_ratings_v1";
let ratings = {};
try { ratings = JSON.parse(localStorage.getItem(ratingsKey) || "{}") || {}; } catch (_) {}

function ratingId(point, index) {
  return `${String(point.name || "").trim()}|${String(point.adresse || "").trim()}|${String(point.lat || "")}|${String(point.lon || "")}|${index}`;
}
function getRating(id) {
  const n = Number(ratings[id]);
  return Number.isInteger(n) && n >= 0 && n <= 5 ? n : 0;
}
function setRating(id, value) {
  ratings[id] = value;
  localStorage.setItem(ratingsKey, JSON.stringify(ratings));

  // Die geöffnete Kachel nicht neu zeichnen: dadurch bleibt das Popup offen.
  document.querySelectorAll(`[data-rating-id="${CSS.escape(id)}"]`).forEach(button => {
    const n = Number(button.getAttribute("data-rating-value"));
    button.textContent = n <= value ? "★" : "☆";
  });
}
function ratingHtml(id, current) {
  let s = '<div class="rating">';
  for (let i = 1; i <= 5; i++) {
    s += `<button type="button" data-rating-id="${escapeHtml(id)}" data-rating-value="${i}" aria-label="${i} von 5 Sternen">${i <= current ? "★" : "☆"}</button>`;
  }
  return s + "</div>";
}
document.addEventListener("click", event => {
  const b = event.target.closest("[data-rating-id]");
  if (!b) return;
  event.preventDefault();
  event.stopPropagation();
  setRating(b.getAttribute("data-rating-id"), Number(b.getAttribute("data-rating-value")));
});

function renderPoints() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const bounds = [];

  points.forEach((point, index) => {
    const marker = L.marker([point.lat, point.lon]).addTo(map);
    const distanceText =
      Number.isFinite(userLatitude) && Number.isFinite(userLongitude)
        ? `<div>📏 Entfernung: ${formatDistance(distanceKm(userLatitude, userLongitude, point.lat, point.lon))}</div>`
        : "";

    const ratingIdValue = ratingId(point, index);
    const currentRating = getRating(ratingIdValue);
    const ratingMarkup = ratingHtml(ratingIdValue, currentRating);

    marker.bindPopup(`
      <div class="popup">${ratingMarkup}
        <h3>${escapeHtml(point.name)}</h3>
        ${point.address ? `<div>🏠 Adresse: ${escapeHtml(point.address)}</div>` : ""}
        <div class="details">
          <div>⚡ Strom: ${escapeHtml(point.strom)}</div>
          <div>💧 Wasser: ${escapeHtml(point.wasser)}</div>
          <div>🚿 Entsorgung: ${escapeHtml(point.entsorgung)}</div>
          <div>🚻 WC/Dusche: ${escapeHtml(point.wcDusche)}</div>
          <div>📍 Koordinaten: ${escapeHtml(String(point.lat))}, ${escapeHtml(String(point.lon))}</div>
          ${distanceText}
          <div>💶 Kosten: ${escapeHtml(point.kosten)}</div>
          <div>📝 ${escapeHtml(point.notiz)}</div>
        </div>
        <div>🅿️ Parkplatz / Link: ${
            (() => {
              const value = String(point.link || "").trim();
              if (!value) return "Keine Angabe";
              const isUrl = /^(https?:\/\/|www\.)/i.test(value);
              if (isUrl) {
                const href = /^https?:\/\//i.test(value) ? value : "https://" + value;
                return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">🔗 ${escapeHtml(value)}</a>`;
              }
              return escapeHtml(value);
            })()
          }</div>
      </div>
    `);
    markers.push(marker);
    bounds.push([point.lat, point.lon]);
  });

  if (bounds.length === 1) map.setView(bounds[0], 14);
  else if (bounds.length > 1) map.fitBounds(bounds, { padding: [50, 50] });
}

async function geocodeAddress(address) {
  const query = String(address || "").trim();
  if (!query) return null;

  const url =
    "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&accept-language=de&q=" +
    encodeURIComponent(query);

  const response = await fetch(url, {
    headers: { "Accept": "application/json" }
  });
  if (!response.ok) throw new Error(`Geocoding HTTP ${response.status}`);
  const results = await response.json();
  if (!results.length) return null;

  const lat = Number(results[0].lat);
  const lon = Number(results[0].lon);
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;

  return { lat, lon };
}

async function geocodeMissingPoints(pointList, status) {
  const missing = pointList.filter(p =>
    !Number.isFinite(p.lat) ||
    !Number.isFinite(p.lon) ||
    (p.lat === 0 && p.lon === 0)
  );

  if (!missing.length) return { points: pointList, unresolved: [] };

  const unresolved = [];

  for (let i = 0; i < missing.length; i++) {
    const point = missing[i];
    status.textContent =
      `Adresse wird gesucht (${i + 1}/${missing.length}): ${point.address || point.name}`;

    try {
      const result = await geocodeAddress(point.address);
      if (result) {
        point.lat = result.lat;
        point.lon = result.lon;
      } else {
        unresolved.push(point);
      }
    } catch (error) {
      console.error("Geocoding-Fehler:", error);
      unresolved.push(point);
    }

    if (i < missing.length - 1) {
      await new Promise(resolve => setTimeout(resolve, 1100));
    }
  }

  return { points: pointList, unresolved };
}


function csvEscape(value) {
  const text = String(value ?? "");
  return '"' + text.replace(/"/g, '""') + '"';
}

function exportRatingsCsv() {
  const headers = [
    "Name", "Adresse", "Latitude", "Longitude", "Parkplatz / Link",
    "Strom", "Wasser", "Entsorgung", "WC/Dusche", "Bewertung",
    "Kosten", "Notiz"
  ];

  const rows = points.map((point, index) => {
    const id = ratingId(point, index);
    const rating = getRating(id);
    return [
      point.name || "",
      point.address || point.adresse || "",
      Number.isFinite(point.lat) ? String(point.lat) : "",
      Number.isFinite(point.lon) ? String(point.lon) : "",
      point.link || "",
      point.strom || "",
      point.wasser || "",
      point.entsorgung || "",
      point.wcDusche || "",
      rating ? String(rating) : "",
      point.kosten || "",
      point.notiz || ""
    ];
  });

  const csv = "\uFEFF" + [headers, ...rows]
    .map(row => row.map(csvEscape).join(";"))
    .join("\r\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `punktekarte_bewertungen_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  document.getElementById("importStatus").textContent =
    "Bewertungen als CSV gespeichert";
}

document.getElementById("exportCsvButton")
  .addEventListener("click", exportRatingsCsv);


document.getElementById("csvFile").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;
  const status = document.getElementById("importStatus");
  status.textContent = "CSV wird geladen …";

  const reader = new FileReader();

  reader.onload = async () => {
    try {
      const imported = pointsFromCSV(reader.result);
      if (!imported.length) throw new Error("Keine gültigen Punkte gefunden.");

      const result = await geocodeMissingPoints(imported, status);

      const validPoints = result.points.filter(p =>
        Number.isFinite(p.lat) &&
        Number.isFinite(p.lon) &&
        !(p.lat === 0 && p.lon === 0)
      );

      if (!validPoints.length) {
        throw new Error("Keine Punkte mit gültigen Koordinaten gefunden.");
      }

            points = validPoints;

      points.forEach((point, index) => {
        const importedRating = Number(point.bewertung || 0);
        if (importedRating >= 1 && importedRating <= 5) {
          ratings[ratingId(point, index)] = importedRating;
        }
      });
      localStorage.setItem(ratingsKey, JSON.stringify(ratings));

      renderPoints();

      if (result.unresolved.length) {
        status.textContent =
          `${points.length} Punkte geladen · ${result.unresolved.length} Adresse(n) nicht gefunden`;
        alert(
          `${result.unresolved.length} Adresse(n) konnten nicht in Koordinaten umgewandelt werden.\n\n` +
          result.unresolved.map(p => `• ${p.name}: ${p.address || "keine Adresse"}`).join("\n")
        );
      } else {
        status.textContent = `${points.length} Punkte aus CSV geladen`;
      }
    } catch (e) {
      console.error(e);
      status.textContent = "Fehler beim Import";
      alert(
        "Die CSV-Datei konnte nicht gelesen oder eine Adresse nicht verarbeitet werden. " +
        "Bitte prüfe die Spalten und die Internetverbindung."
      );
    }
  };

  reader.onerror = () => {
    status.textContent = "Fehler beim Lesen der Datei";
    alert("Die CSV-Datei konnte nicht gelesen werden.");
  };

  reader.readAsText(file, "utf-8");
});


let userLocationMarker = null;
let userLatitude = null;
let userLongitude = null;

document.getElementById("locateButton").addEventListener("click", () => {
  if (!navigator.geolocation) {
    alert("Der aktuelle Standort wird von diesem Browser nicht unterstützt.");
    return;
  }

  const button = document.getElementById("locateButton");
  button.textContent = "📍 Standort wird gesucht …";

  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      userLatitude = lat;
      userLongitude = lon;

      if (userLocationMarker) map.removeLayer(userLocationMarker);

      userLocationMarker = L.circleMarker([lat, lon], {
        radius: 9,
        weight: 3,
        fillOpacity: 0.8
      }).addTo(map);

      userLocationMarker.bindPopup("📍 Mein aktueller Standort").openPopup();
      renderPoints();
      map.setView([lat, lon], 14);
      button.textContent = "📍 Mein Standort";
    },
    error => {
      button.textContent = "📍 Mein Standort";
      let message = "Der Standort konnte nicht ermittelt werden.";
      if (error.code === 1) {
        message = "Der Zugriff auf den Standort wurde nicht erlaubt. Bitte erlaube der Punktekarte den Standortzugriff.";
      }
      alert(message);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
  );
});

renderPoints();

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[c]));
}

function escapeAttr(text) {
  return String(text).replace(/"/g, "&quot;");
}
</script>

</body>
</html>
